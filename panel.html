<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل فروشگاه</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,"Segoe UI",sans-serif;background:#f3f4f8;color:#1b1b1f;font-size:19px;line-height:1.7}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:16px 14px 90px}
h1{font-size:26px;margin:8px 0 4px}
h2{font-size:23px;margin:6px 0 12px}
.sub{color:#666;font-size:17px;margin-bottom:16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{background:#fff;border:2px solid #d6d6dd;border-radius:14px;padding:10px 16px;font-size:18px;font-family:inherit;cursor:pointer}
.big{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:0;border-radius:20px;padding:22px 18px;margin-bottom:14px;font-family:inherit;font-size:23px;font-weight:bold;text-align:right;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08);color:#1b1b1f}
.big .ic{font-size:40px}
.big small{display:block;font-size:16px;font-weight:normal;color:#666}
.badge{background:#e5322d;color:#fff;border-radius:20px;padding:2px 12px;font-size:18px;margin-right:auto}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:18px;font-family:inherit;font-size:22px;font-weight:bold;cursor:pointer;margin:10px 0;background:#fff;color:#1b1b1f;border:2px solid #d6d6dd}
.btn.green{background:#17a34a;color:#fff;border-color:#17a34a}
.btn.red{background:#fff;color:#d12b2b;border-color:#e9b3b3}
.btn.blue{background:#3b5bdb;color:#fff;border-color:#3b5bdb}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.prow{display:flex;align-items:center;gap:12px;cursor:pointer}
.thumb{width:64px;height:64px;border-radius:14px;background:#eef0ff;display:flex;align-items:center;justify-content:center;font-size:36px;flex:none;background-size:cover;background-position:center}
.pn{font-weight:bold;font-size:20px}.pm{color:#555;font-size:16px}
.low{color:#c2410c;font-weight:bold}
label{display:block;font-weight:bold;margin:14px 0 6px;font-size:20px}
input[type=text],input[type=tel]{width:100%;border:2px solid #cfd2dc;border-radius:14px;padding:14px;font-size:22px;font-family:inherit;background:#fff}
input:focus{outline:none;border-color:#3b5bdb}
.hint{color:#666;font-size:16px;margin-top:4px}
.emos{display:flex;flex-wrap:wrap;gap:8px}
.emo{font-size:30px;background:#fff;border:3px solid #d6d6dd;border-radius:14px;padding:6px 10px;cursor:pointer}
.emo.on{border-color:#3b5bdb;background:#eef0ff}
.srow{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;border:2px solid #e3e5ec}
.srow b{font-size:22px;min-width:64px}
.cnt{display:flex;align-items:center;gap:8px;margin-right:auto}
.cnt button{width:50px;height:50px;border-radius:14px;border:2px solid #cfd2dc;background:#f7f7fb;font-size:28px;font-family:inherit;cursor:pointer}
.cnt span{min-width:44px;text-align:center;font-size:26px;font-weight:bold}
.x{background:none;border:0;font-size:24px;cursor:pointer;color:#c33;padding:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip.sel{background:#3b5bdb;color:#fff}
.chip{background:#fff;border:2px solid #3b5bdb;color:#3b5bdb;border-radius:14px;padding:8px 16px;font-size:20px;font-family:inherit;cursor:pointer}
.err{background:#fde8e8;color:#b42318;border-radius:14px;padding:12px;font-weight:bold;margin:10px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17a34a;color:#fff;padding:14px 24px;border-radius:30px;font-size:20px;font-weight:bold;z-index:9;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.tag{display:inline-block;border-radius:20px;padding:4px 14px;font-size:17px;font-weight:bold}
.t-go{background:#dcfce7;color:#15803d}.t-wait{background:#fef3c7;color:#a16207}.t-done{background:#e5e7eb;color:#4b5563}.t-x{background:#fee2e2;color:#b91c1c}
.ord .l{margin:4px 0}
.ord a{color:#3b5bdb;font-weight:bold}
.lnk{direction:ltr;text-align:left;background:#f1f2f7;border-radius:12px;padding:10px;font-size:15px;word-break:break-all;margin:6px 0}
.empty{text-align:center;color:#777;padding:30px 0}
.tiny{background:none;border:0;color:#888;text-decoration:underline;font-family:inherit;font-size:15px;cursor:pointer;margin-top:24px}
.photo-prev{width:120px;height:120px;border-radius:16px;background:#eef0ff;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:60px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const KEY='sb_products',OKEY='sb_orders';
const BASE=[
 {c:'TS1',n:'تیشرت مردانه',p:450000,e:'👕',k:['تیشرت','تی شرت'],s:{S:5,M:8,L:3,XL:0}},
 {c:'HD2',n:'هودی کلاه‌دار',p:890000,e:'🧥',k:['هودی','سویشرت'],s:{M:4,L:2,XL:6}},
 {c:'JN3',n:'شلوار جین مردانه',p:1250000,e:'👖',k:['شلوار','جین'],s:{'30':3,'32':5,'34':2}},
 {c:'SH4',n:'کفش کتانی',p:1650000,e:'👟',k:['کفش','کتونی','کتانی'],s:{'40':2,'41':4,'42':0,'43':3}},
 {c:'BG5',n:'کیف دوشی',p:780000,e:'👜',k:['کیف'],s:{'تک‌سایز':7}},
 {c:'DR6',n:'پیراهن زنانه',p:920000,e:'👗',k:['پیراهن','لباس مجلسی'],s:{S:3,M:5,L:0}},
 {c:'SC7',n:'شال',p:350000,e:'🧣',k:['شال','روسری'],s:{'فری':12}},
 {c:'CP8',n:'کلاه کپ',p:220000,e:'🧢',k:['کلاه','کپ'],s:{'فری':9}},
 {c:'JK9',n:'کاپشن',p:2300000,e:'🧥',k:['کاپشن','بارونی','پافر'],s:{M:2,L:1,XL:2}},
 {c:'SK10',n:'دامن',p:680000,e:'🩳',k:['دامن'],s:{S:4,M:4}},
];
const clone=o=>JSON.parse(JSON.stringify(o));
const $=id=>document.getElementById(id);
const nf=n=>Number(n).toLocaleString('fa-IR');
const noF=n=>Number(n).toLocaleString('fa-IR',{useGrouping:false});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const digits=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
let prods=load(KEY);
if(!Array.isArray(prods)||!prods.length){prods=clone(BASE);save()}
function save(){localStorage.setItem(KEY,JSON.stringify(prods))}
function orders(){const a=load(OKEY);return Array.isArray(a)?a:[]}
function saveOrders(a){localStorage.setItem(OKEY,JSON.stringify(a))}
const EMOS=['👕','👖','🧥','👟','👜','🧣','🧢','👗','🩳','🎁','📦','💍'];
const PRESETS=['S','M','L','XL','XXL','38','39','40','41','42','43','44','فری','تک‌سایز'];
let scr='home',ed=null,msg='',confirmDel=false,toastT,q='',flt='all',shown=20,ordTab='todo',lq='';
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function go(s){scr=s;msg='';confirmDel=false;render();window.scrollTo(0,0)}
function stockText(p){
  const e=Object.entries(p.s);if(!e.length)return '<span class="low">موجودی ندارد</span>';
  const tot=e.reduce((a,[k,v])=>a+v,0);
  if(tot==0)return '<span class="low">تمام شده</span>';
  return e.map(([k,v])=>v==0?`<span class="low">${esc(k)}: تمام</span>`:v<=2?`<span class="low">${esc(k)}: ${nf(v)}</span>`:`${esc(k)}: ${nf(v)}`).join(' · ');
}
function newCount(){return orders().filter(o=>o.status=='paid'&&!o.sent).length}
function render(){
  const a=$('app');
  if(scr=='home'){
    const n=newCount();
    a.innerHTML=`<h1>🏪 پنل فروشگاه</h1><div class="sub">هر کاری لازم است، یکی از دکمه‌های زیر را بزنید.</div>
    <button class="big" onclick="go('orders')"><span class="ic">🧾</span><span>سفارش‌ها<small>${n?'سفارش جدید داری، ببین!':'سفارش‌های مشتری‌ها'}</small></span>${n?`<span class="badge">${nf(n)} جدید</span>`:''}</button>
    <button class="big" onclick="go('prods')"><span class="ic">📦</span><span>کالاها<small>افزودن، تغییر قیمت و موجودی</small></span></button>
    <button class="big" onclick="go('links')"><span class="ic">🔗</span><span>لینک فروشگاه<small>برای گذاشتن در اینستاگرام</small></span></button>
    <div style="text-align:center">${confirmDel?`<div class="card">همه‌ی کالاها و سفارش‌ها پاک شود و نمونه‌ها برگردد؟<button class="btn red" onclick="resetAll()">بله، پاک کن</button><button class="btn" onclick="confirmDel=false;render()">نه</button></div>`:`<button class="tiny" onclick="confirmDel=true;render()">برگرداندن همه‌چیز به حالت نمونه</button>`}</div>`;
  }
  else if(scr=='prods'){
    const nLow=prods.filter(isLow).length;
    a.innerHTML=`<div class="top"><button class="back" onclick="go('home')">← برگشت</button></div><h2>📦 کالاها <span style="font-weight:normal;font-size:18px;color:#666">(${nf(prods.length)} کالا)</span></h2>
    <button class="btn green" onclick="newProd()">➕ کالای جدید</button>
    <input type="text" id="q" value="${esc(q)}" placeholder="🔍 اسم کالا را بنویس تا پیدا شود" oninput="q=this.value;shown=20;renderPList()" style="margin-bottom:10px">
    <div class="chips" style="margin:0 0 12px"><button class="chip ${flt=='all'?'sel':''}" onclick="flt='all';shown=20;render()">همه</button><button class="chip ${flt=='low'?'sel':''}" onclick="flt='low';shown=20;render()">⚠ کم یا تمام‌شده (${nf(nLow)})</button></div>
    <div id="plist"></div>`;
    renderPList();
  }
  else if(scr=='edit'){
    const isNew=!prods.find(p=>p.c==ed.c);
    a.innerHTML=`<div class="top"><button class="back" onclick="go('prods')">← برگشت</button></div><h2>${isNew?'➕ کالای جدید':'✏️ تغییر کالا'}</h2>
    ${msg?`<div class="err">${msg}</div>`:''}
    <label>۱. اسم کالا</label><input type="text" id="fn" value="${esc(ed.n)}" placeholder="مثلاً: تیشرت مردانه" oninput="ed.n=this.value">
    <label>۲. قیمت (به تومان)</label><input type="tel" id="fp" value="${ed.p?digits(ed.p):''}" placeholder="مثلاً: 450000" inputmode="numeric" oninput="ed.p=+digits(this.value).replace(/\\D/g,'')||0;$('pp').textContent=ed.p?nf(ed.p)+' تومان':''">
    <div class="hint" id="pp" style="font-weight:bold;color:#17a34a">${ed.p?nf(ed.p)+' تومان':''}</div>
    <label>۳. عکس</label>
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="photo-prev" style="${ed.img?`background-image:url(${ed.img})`:''}">${ed.img?'':esc(ed.e)}</div>
    <div><label class="btn blue" style="margin:0;padding:12px 18px;font-size:19px;cursor:pointer">📷 عکس بگذار<input type="file" accept="image/*" style="display:none" onchange="pickPhoto(this)"></label>${ed.img?'<button class="tiny" onclick="ed.img=null;render()">عکس را بردار</button>':''}</div></div>
    ${ed.img?'':`<div class="hint">اگر عکس نداری، یکی از این شکل‌ها را بزن:</div><div class="emos">${EMOS.map(x=>`<span class="emo ${x==ed.e?'on':''}" onclick="ed.e='${x}';render()">${x}</span>`).join('')}</div>`}
    <label>۴. چند تا داری؟</label>
    <div class="hint">برای هر سایز یا مدل، تعداد را با + و − بزن. تمام شد؟ صفر بگذار.</div>
    <div style="margin-top:8px">${Object.entries(ed.s).map(([k,v])=>`<div class="srow"><b>${esc(k)}</b><div class="cnt"><button onclick="chg('${esc(k)}',-1)">−</button><span>${nf(v)}</span><button onclick="chg('${esc(k)}',1)">+</button></div><button class="x" onclick="delSize('${esc(k)}')">✖</button></div>`).join('')||'<div class="hint">هنوز سایزی نیست. زیر را بزن.</div>'}</div>
    <div class="hint" style="margin-top:10px">➕ یک سایز اضافه کن:</div>
    <div class="chips">${PRESETS.filter(x=>!(x in ed.s)).map(x=>`<button class="chip" onclick="addSize('${x}')">${x}</button>`).join('')}</div>
    <button class="btn green" style="margin-top:26px" onclick="saveProd()">✅ ذخیره</button>
    ${isNew?'':`<button class="btn" onclick="cp(new URL('./',location.href).href+'#${esc(ed.c)}')">📋 کپی لینک این کالا</button>`}
    ${isNew?'':(confirmDel?`<div class="card">این کالا برای همیشه پاک شود؟<button class="btn red" onclick="delProd()">بله، پاک کن</button><button class="btn" onclick="confirmDel=false;render()">نه</button></div>`:`<button class="btn red" onclick="confirmDel=true;render()">🗑 پاک کردن این کالا</button>`)}`;
  }
  else if(scr=='orders'){
    const all=orders().slice().sort((x,y)=>y.no-x.no),nTodo=all.filter(o=>o.status=='paid'&&!o.sent).length;
    const list=ordTab=='todo'?all.filter(o=>o.status=='paid'&&!o.sent):all;
    a.innerHTML=`<div class="top"><button class="back" onclick="go('home')">← برگشت</button></div><h2>🧾 سفارش‌ها</h2>
    <div class="chips" style="margin:0 0 12px"><button class="chip ${ordTab=='todo'?'sel':''}" onclick="ordTab='todo';render()">🟢 باید بفرستم (${nf(nTodo)})</button><button class="chip ${ordTab=='all'?'sel':''}" onclick="ordTab='all';render()">همه (${nf(all.length)})</button></div>`+
    (ordTab=='todo'&&!list.length?`<div class="empty">${all.length?'همه‌ی سفارش‌ها فرستاده شده ✅':'هنوز سفارشی نیامده.<br>وقتی مشتری خرید کند، اینجا می‌بینید.'}</div>`:'')+
    (list.length?list.map(o=>{
      let tag,btn='';
      if(o.status=='paid'&&!o.sent){tag='<span class="tag t-go">🟢 پول رسیده؛ بفرستید</span>';btn=`<button class="btn green" onclick="sent(${o.no})">📦 فرستادم</button>`}
      else if(o.status=='paid'){tag='<span class="tag t-done">✔ فرستاده شد</span>'}
      else if(o.status=='expired'){tag='<span class="tag t-x">لغو شد (پرداخت نکرد)</span>'}
      else tag='<span class="tag t-wait">⏳ منتظر پرداخت مشتری</span>';
      return `<div class="card ord"><div><b>سفارش ${noF(o.no)}</b> · ${esc(o.time||'')}</div><div class="l">${tag}</div>
      <div class="l">👤 ${esc(o.name)}</div><div class="l">📱 <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></div><div class="l">📍 ${esc(o.addr)}</div>
      <div class="l">🛍 ${(o.items||[]).map(esc).join('، ')}</div><div class="l"><b>مبلغ: ${nf(o.total)} تومان</b></div>${btn}</div>`}).join('')
    :'');
  }
  else if(scr=='links'){
    const base=new URL('./',location.href).href;
    const welcome='سلام! به فروشگاه خوش آمدید. برای دیدن قیمت و موجودی زنده و ثبت سفارش اینجا بزنید: '+base;
    a.innerHTML=`<div class="top"><button class="back" onclick="go('home')">← برگشت</button></div><h2>🔗 لینک فروشگاه</h2>
    <div class="card"><b>لینک اصلی فروشگاه</b><div class="lnk">${esc(base)}</div><button class="btn blue" onclick="cp('${esc(base)}')">📋 کپی لینک</button><div class="hint">این را در بایو اینستاگرام بگذارید.</div></div>
    <div class="card"><b>متن آماده برای پیام خودکار دایرکت</b><div class="lnk" style="direction:rtl;text-align:right">${esc(welcome)}</div><button class="btn blue" onclick="cp(${JSON.stringify(welcome).replace(/"/g,'&quot;')})">📋 کپی متن</button></div>
    <div class="card"><b>لینک یک کالای مشخص</b><div class="hint">برای استوری یا پست. اسم کالا را بنویس:</div>
    <input type="text" id="lq" value="${esc(lq)}" placeholder="🔍 اسم کالا" oninput="lq=this.value;renderLinkRes()" style="margin-top:8px"><div id="lres"></div></div>`;
    renderLinkRes();
  }
}
const norm=s=>digits(String(s||'')).replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/‌/g,' ').toLowerCase().trim();
function isLow(p){const v=Object.values(p.s);return !v.length||v.some(x=>x<=2)}
function find(qq){const t=norm(qq);return t?prods.filter(p=>norm(p.n).includes(t)||norm(p.c).includes(t)):prods}
function renderPList(){
  let list=find(q);if(flt=='low')list=list.filter(isLow);
  const el=$('plist');if(!el)return;
  if(!list.length){el.innerHTML=`<div class="empty">${prods.length?'چیزی پیدا نشد.':'هنوز کالایی نیست. دکمه‌ی سبز را بزنید.'}</div>`;return}
  el.innerHTML=list.slice(0,shown).map(p=>{const tot=Object.values(p.s).reduce((a,v)=>a+v,0),low=isLow(p);
    return `<div class="card" style="padding:10px"><div class="prow" onclick="editProd('${p.c}')"><div class="thumb" style="width:50px;height:50px;font-size:28px;${p.img?`background-image:url(${p.img})`:''}">${p.img?'':esc(p.e||'📦')}</div><div style="min-width:0"><div class="pn" style="font-size:19px">${esc(p.n)}</div><div class="pm">${nf(p.p)} تومان · ${tot?nf(tot)+' عدد':'<span class="low">تمام شد</span>'}${low&&tot?' <span class="low">⚠ کم</span>':''}</div></div></div></div>`}).join('')
    +(list.length>shown?`<button class="btn" onclick="shown+=20;renderPList()">نمایش بیشتر (${nf(list.length-shown)} کالای دیگر)</button>`:'');
}
function renderLinkRes(){
  const el=$('lres');if(!el)return;const base=new URL('./',location.href).href;
  if(!norm(lq)){el.innerHTML='';return}
  const l=find(lq).slice(0,5);
  el.innerHTML=l.length?l.map(p=>`<div style="margin-top:10px"><div class="pn" style="font-size:19px">${esc(p.n)}</div><button class="btn blue" style="padding:12px;font-size:19px;margin:6px 0 0" onclick="cp('${esc(base)}#${esc(p.c)}')">📋 کپی لینک این کالا</button></div>`).join(''):'<div class="empty" style="padding:12px">چیزی پیدا نشد.</div>';
}
function cp(t){
  const done=()=>toast('کپی شد ✅');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>fb(t,done));else fb(t,done);
}
function fb(t,done){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(e){}x.remove();done()}
function nextCode(){let n=1;while(prods.some(p=>p.c=='NW'+n))n++;return 'NW'+n}
function newProd(){ed={c:nextCode(),n:'',p:0,e:'📦',img:null,s:{}};msg='';confirmDel=false;scr='edit';render()}
function editProd(c){ed=clone(prods.find(p=>p.c==c));msg='';confirmDel=false;scr='edit';render();window.scrollTo(0,0)}
function chg(k,d){ed.s[k]=Math.max(0,(ed.s[k]||0)+d);keep(()=>render())}
function addSize(k){ed.s[k]=1;keep(()=>render())}
function delSize(k){delete ed.s[k];keep(()=>render())}
function keep(f){f()}
function pickPhoto(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const m=360,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    ed.img=c.toDataURL('image/jpeg',.72);render()};im.src=r.result};r.readAsDataURL(f);
}
function saveProd(){
  ed.n=(ed.n||'').trim();
  if(!ed.n){msg='اسم کالا را بنویسید.';render();window.scrollTo(0,0);return}
  if(!ed.p||ed.p<=0){msg='قیمت را بنویسید (فقط عدد).';render();window.scrollTo(0,0);return}
  if(!Object.keys(ed.s).length){msg='حداقل یک سایز و تعداد بگذارید (اگر سایز ندارد «تک‌سایز» را بزنید).';render();window.scrollTo(0,0);return}
  const words=ed.n.split(/\s+/).filter(w=>w.length>2);ed.k=[ed.n,...words];
  const i=prods.findIndex(p=>p.c==ed.c);if(i>=0)prods[i]=ed;else prods.push(ed);
  save();toast('ذخیره شد ✅');go('prods');
}
function delProd(){prods=prods.filter(p=>p.c!=ed.c);save();toast('پاک شد');go('prods')}
function sent(no){const a=orders();const o=a.find(x=>x.no==no);if(o){o.sent=true;saveOrders(a)}toast('ثبت شد ✅');render()}
function resetAll(){localStorage.removeItem(KEY);localStorage.removeItem(OKEY);prods=clone(BASE);save();confirmDel=false;toast('برگشت به نمونه');render()}
window.addEventListener('storage',()=>{prods=load(KEY)||prods;if(scr=='orders'||scr=='home'||scr=='prods')render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){prods=load(KEY)||prods;if(scr!='edit')render()}});
render();
</script>
</body>
